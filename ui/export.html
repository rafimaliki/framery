<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>Framery export</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="canvas.css">
  <style>
    html, body { margin: 0; background: var(--bg); }
    body.transparent, body.transparent html { background: transparent; }
    #stage { position: relative; overflow: hidden; }
    /* the canvas styles assume a viewport child; here the world is just placed */
    #world { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; --z: 1; --ring: 3px; }
    #arrows { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; overflow: hidden; }
    .fr > .bd > iframe { opacity: 1; }
  </style>
</head>
<body>
<div id="stage"><div id="world"></div><svg class="arrows" id="arrows"></svg></div>
<script type="module" src="export.js"></script>
</body>
</html>
